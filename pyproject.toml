[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "feature-flags-service"
version = "0.1.0"
description = "Feature flag and remote config service: targeting rules, sticky percentage rollouts, segments, scheduled changes, ETag/SSE delivery and typed SDKs"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Akib Jafor" }]
requires-python = ">=3.10"
keywords = ["feature-flags", "remote-config", "rollout", "targeting", "fastapi", "sse", "sdk"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Framework :: FastAPI",
  "License :: OSI Approved :: MIT License",
]
dependencies = [
  "fastapi>=0.110,<1.0",
  "uvicorn[standard]>=0.27",
  "sqlalchemy>=2.0,<3.0",
  "pydantic>=2.5,<3.0",
  "pydantic-settings>=2.1",
  "httpx>=0.26",
  "redis>=5.0",
  "psycopg[binary]>=3.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4",
  "pytest-asyncio>=0.23",
  "pytest-cov>=4.1",
  "fakeredis>=2.20",
  "ruff>=0.3",
]

[tool.setuptools.packages.find]
include = ["feature_flags*"]

[tool.pytest.ini_options]
testpaths = ["tests", "sdk/python/tests"]
addopts = "-q"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
  "error::DeprecationWarning:feature_flags.*",
  "ignore:Using `httpx` with `starlette.testclient`",
]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["sdk/typescript"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["feature_flags", "flagclient"]
