# Render blueprint: API (scheduled-change sweeper runs in-process) + managed PostgreSQL
# + Key Value (Redis-compatible) store for the payload cache, usage counters and SSE fan-out.
# https://render.com/docs/blueprint-spec
services:
  - type: web
    name: feature-flags-service
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PORT
        value: "8000"
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: SCHEDULER_INTERVAL_SECONDS
        value: "15"
      - key: DATABASE_URL
        fromDatabase:
          name: feature-flags-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: feature-flags-redis
          property: connectionString
      - key: ADMIN_API_KEY
        generateValue: true

  - type: keyvalue
    name: feature-flags-redis
    plan: free
    ipAllowList: []

databases:
  - name: feature-flags-db
    plan: free
    databaseName: flags
    user: flags
